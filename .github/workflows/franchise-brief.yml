name: Weekly Franchise Brief

on:
  schedule:
    # 20:30 UTC Wed = 6:30am AEST Thursday (Brisbane, no DST).
    # Deliberately an hour after the daily so the two never send together.
    - cron: "30 20 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build HTML, don't send)"
        type: boolean
        default: false

permissions:
  contents: write

# Shares a group with the daily: both write data/ and docs/ and push to the
# same branch, so overlapping runs would race on the commit.
concurrency:
  group: asset-brief-publish
  cancel-in-progress: false

jobs:
  send-franchise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send the franchise brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          python -u editions.py franchise 2>&1 | tee run.log

      - name: Summarise run
        if: always()
        run: |
          {
            echo "### Franchise Brief run"
            echo ""
            grep -E '^COST' run.log 2>/dev/null | sed 's/^/    /' || echo "_no cost recorded_"
            echo ""
            echo "**Findings kept per source**"
            echo '```'
            grep -E '^\[info\] .*: [0-9]+ kept' run.log 2>/dev/null || echo "none"
            echo '```'
            echo "Stale/undated rejected: **$(grep -c 'REJECTED STALE' run.log 2>/dev/null || echo 0)**"
            if grep -qE '^\[warn\]|^FAILED' run.log 2>/dev/null; then
              echo ""
              echo "<details><summary>Warnings</summary>"
              echo ""; echo '```'
              grep -E '^\[warn\]|^FAILED' run.log | head -40
              echo '```'; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit memory and archive
        if: ${{ success() && !inputs.dry_run }}
        run: |
          git config user.name "asset-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Franchise edition $(date -u +%F) [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Upload preview (dry runs only)
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: franchise-preview
          path: |
            brief_preview.html
            run.log
          if-no-files-found: warn
