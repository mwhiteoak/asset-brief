# ============================================================================
# The Franchise Brief — WEEKLY edition configuration
#
# Different beat, different rhythm. Franchise news moves in reporting cycles,
# disclosure-document updates, network announcements and deal processes rather
# than daily transactions — so this runs once a week over a 7-day window.
# ============================================================================

brief_name: The Franchise Brief
edition: franchise      # separate memory store and archive prefix
cadence: weekly         # 7-day window

# ----------------------------------------------------------------------------
# ASX TICKERS — the listed franchise universe. Validated against the ASX API
# in Aug 2026; McGrath (MEA), Reject Shop (TRS) and ABC were dropped because
# they have been taken private or delisted.
# ----------------------------------------------------------------------------
asx_tickers:
  # Franchisors — they franchise their own brands
  - DMP   # Domino's Pizza Enterprises
  - RFG   # Retail Food Group (Donut King, Gloria Jean's, Brumby's, Crust)
  - GYG   # Guzman y Gomez
  - HVN   # Harvey Norman (Australian complexes are franchised)
  - SIG   # Sigma Healthcare / Chemist Warehouse
  - CCV   # Cash Converters
  - JYC   # Joyce Corporation (Bedshed)
  - KME   # Kip McGrath Education Centres
  - OLI   # Oliver's Real Food
  # Large franchisees and multi-site operators
  - CKF   # Collins Foods (KFC, Taco Bell franchisee)
  - APE   # Eagers Automotive (dealership networks)
  - VVA   # Viva Leisure (Club Lime)
  - SSG   # Shaver Shop
  # Franchise-adjacent networks, suppliers and channel owners
  - BAP   # Bapcor (Autobarn, Midas)
  - AX1   # Accent Group
  - MHJ   # Michael Hill
  - LOV   # Lovisa
  - AFG   # Australian Finance Group (mortgage broking network)
  - ALD   # Ampol (franchised fuel/convenience sites)
  - VEA   # Viva Energy (OTR, Coles Express)
  - BLX   # Beacon Lighting
  - MTS   # Metcash (IGA, Mitre 10, Total Tools banner groups)
  - ADH   # Adairs
  - UNI   # Universal Store
  # Majors whose store-network decisions move the franchise market
  - WES   # Wesfarmers
  - COL   # Coles
  - WOW   # Woolworths
  - EDV   # Endeavour Group
  # Listed investors that hold multi-site consumer businesses
  - SOL   # Washington H. Soul Pattinson
  - MAF   # MA Financial
  - RPL   # Regal Partners
  - BTI   # Bailador Technology Investments
  - TOP   # Thorney Opportunities

# ----------------------------------------------------------------------------
# TICKER NOTES — why each listed company matters to franchising. Rendered
# beside the code in the ASX section, because "Bailador Technology
# Investments (BTI)" tells a franchise reader nothing on its own.
# ----------------------------------------------------------------------------
ticker_notes:
  DMP: "Domino's — largest pizza franchisor, ~700 AU/NZ stores"
  RFG: "Retail Food Group — Donut King, Gloria Jean's, Brumby's, Crust; ~700 AU outlets"
  GYG: "Guzman y Gomez — fast-growing QSR franchisor, ~250 restaurants"
  HVN: "Harvey Norman — AU complexes run on a franchise model, ~195 franchisees"
  SIG: "Sigma/Chemist Warehouse — ~880 franchised pharmacies, largest pharmacy franchisor"
  CCV: "Cash Converters — ~650 stores globally, mixed corporate and franchise"
  JYC: "Joyce Corp — Bedshed bedding franchise, ~42 stores"
  KME: "Kip McGrath — tutoring franchise, ~430 centres ANZ/UK"
  OLI: "Oliver's Real Food — highway QSR, small franchised network"
  CKF: "Collins Foods — Australia's largest KFC franchisee, plus Taco Bell"
  APE: "Eagers Automotive — largest dealership network, franchise-model motor retail"
  VVA: "Viva Leisure — Club Lime gyms, corporate plus franchised sites"
  SSG: "Shaver Shop — specialty retail, franchises largely bought back"
  BAP: "Bapcor — Autobarn and Midas franchise networks"
  AX1: "Accent Group — footwear retail and distribution, franchised banners"
  MHJ: "Michael Hill — jewellery retail with franchised stores"
  LOV: "Lovisa — accessories, franchise/partner model in offshore markets"
  AFG: "Australian Finance Group — mortgage broking franchise network"
  ALD: "Ampol — franchised fuel and convenience sites"
  VEA: "Viva Energy — OTR and Coles Express convenience network"
  BLX: "Beacon Lighting — lighting retail with franchised stores"
  MTS: "Metcash — IGA, Mitre 10 and Total Tools banner groups"
  ADH: "Adairs — homewares retail, national store network"
  UNI: "Universal Store — youth apparel, national network"
  WES: "Wesfarmers — Bunnings, Kmart, Officeworks; sets the retail site benchmark"
  COL: "Coles — supermarket anchor, Coles Express franchise history"
  WOW: "Woolworths — supermarket anchor, major centre tenant"
  EDV: "Endeavour — BWS and Dan Murphy's, franchised liquor banners"
  SOL: "Soul Pattinson — listed investor, holds multi-site consumer businesses"
  MAF: "MA Financial — asset manager, invests in consumer and hospitality"
  RPL: "Regal Partners — listed fund manager, small/mid-cap consumer exposure"
  BTI: "Bailador — listed VC, backs growth-stage multi-site and tech businesses"
  TOP: "Thorney Opportunities — listed investor in small-cap consumer names"

# Franchise readers do not price assets off the cash rate — the property
# brief's RBA/bond/A-REIT strip is noise here.
show_market_signals: false

