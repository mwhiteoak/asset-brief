# ----------------------------------------------------------------------------
# SOURCE ALLOWLIST — for the Anthropic passes only. Grok searches the open web.
# ----------------------------------------------------------------------------
# Verified blocked to Anthropic's crawler (do not re-add): qsrmedia.com.au.
# Grok still reaches it — it stays in PRIORITY_SOURCES in franchise_brief.py.
allowed_domains:
  - insideretail.com.au
  - insidefmcg.com.au
  - hospitalitymagazine.com.au
  - ragtrader.com.au
  - franchisebusiness.com.au
  - insidesmallbusiness.com.au
  - smartcompany.com.au
  - businessnewsaustralia.com
  - startupdaily.net
  - accc.gov.au
  - franchise.org.au
  - asbfeo.gov.au
  - fairwork.gov.au
  - shoppingcentrenews.com.au
  - realcommercial.com.au
  - commercialrealestate.com.au
  - theurbandeveloper.com
  - australianpropertyjournal.com.au

blocked_domains:
  - fool.com.au
  - motleyfool.com.au
  - marketindex.com.au
  - hotcopper.com.au
  - simplywall.st

enforce_allowlist_for_grok: false
min_relevance: 5
# Weekly cadence, so the window is 7 days and findings may be a little older
# than the daily tolerates without being stale to a weekly reader.
max_finding_age_days: 12
date_recheck_min_relevance: 7
portfolio: []
rba_meeting_dates:
  - 2026-09-15
  - 2026-11-03
  - 2026-12-08

# No cap rates in franchising — the comparables hunt is property-only.
enable_comparables: false

# A weekly reader has seen nothing for 7 days, and regulatory, court and
# enforcement stories surface slowly. A 12-day ceiling threw away an ACCC
# penalty against a watchlist franchisor and a $35m Harvey Norman fine.
max_finding_age_days: 21
max_intel_age_days: 45
